<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A9B8E" />
      <stop offset="50%" stop-color="#254441" />
      <stop offset="100%" stop-color="#142624" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E6B17E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97757" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(94,124,123,0.25)" stroke-width="4" />

  <g>
    <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#ringGrad)" stroke-width="7" transform="rotate(-25 256 256)" stroke-dasharray="14 8" />
    <ellipse cx="256" cy="256" rx="145" ry="60" fill="none" stroke="rgba(74,155,142,0.4)" stroke-width="4" transform="rotate(35 256 256)" />
  </g>

  <circle cx="95" cy="195" r="14" fill="#D97757" />
  <circle cx="410" cy="310" r="18" fill="#E6B17E" />

  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="92" fill="url(#planetGrad)" stroke="rgba(217,119,87,0.5)" stroke-width="5" />
    <path d="M 180 230 C 210 200, 290 200, 330 240 C 290 270, 210 270, 180 230 Z" fill="rgba(240, 248, 255, 0.25)" />
    <path d="M 195 280 C 225 260, 275 290, 315 270" fill="none" stroke="rgba(240, 248, 255, 0.35)" stroke-width="5" stroke-linecap="round" />
  </g>

  <path d="M 256 195 L 265 235 L 305 244 L 265 253 L 256 293 L 247 253 L 207 244 L 247 235 Z" fill="#F7F5F2" filter="url(#glow)" />
</svg>
